name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar
        run: dotnet build VMGuard.sln -c Release

      - name: Tests
        run: dotnet test VMGuard.sln -c Release --no-build --verbosity normal

      - name: Preparar el exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/VMGuard/bin/Release/net48/VMGuard.exe dist/
          Get-Item dist/VMGuard.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VMGuard
          path: dist/VMGuard.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VMGuard.exe
