name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag to publish as a release (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build VMGuard.sln -c Release

      - name: Test
        run: dotnet test VMGuard.sln -c Release --no-build --verbosity normal

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { '' }
          $version = if ($tag) { $tag.TrimStart('v') } else { 'dev' }
          New-Item -ItemType Directory -Force dist, pkg | Out-Null
          Copy-Item src/VMGuard/bin/Release/net48/VMGuard.exe dist/
          Copy-Item dist/VMGuard.exe, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/VMGuard-$version-win.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VMGuard
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag is created on the commit that was built
          tag_name: ${{ github.event.inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            VMGuard suspends every VMware Workstation VM when Windows shuts down, restarts or signs out, and when the battery runs low while unplugged.

            **Requirements:** Windows 10/11 (uses the built-in .NET Framework 4.8) and VMware Workstation.

            **Install:** download `VMGuard.exe` and run `.\VMGuard.exe --install` (no admin needed). See the README for options, dry-run mode and uninstalling.

            The exe is not code-signed, so SmartScreen may warn on first run: choose *More info → Run anyway*. `SHA256SUMS.txt` lists the file hashes.
